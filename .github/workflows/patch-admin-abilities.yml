name: Patch Admin Abilities

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - scripts/patch_admin_abilities_and_player_state.py
      - .github/workflows/patch-admin-abilities.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix abilities panel insertion guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/patch_admin_abilities_and_player_state.py")
          s = p.read_text(encoding="utf-8")
          old = '''if 'section === "abilities"' not in app.split(inventory_render)[0]:'''
          new = '''if '<AbilitiesManagerPanel' not in app:'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Patch admin + Apps Script
        run: python scripts/patch_admin_abilities_and_player_state.py
      - name: Set teacher password securely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs")
          s = p.read_text(encoding="utf-8")

          start = s.find("function teacherPasscode_() {")
          end = s.find("function teacherTokenKey_", start)
          if start < 0 or end < 0:
              raise SystemExit("Teacher auth block not found")

          auth = r'''const TEACHER_DEFAULT_PASSCODE_SHA256 =
  "814f916ced42a28c6a205612ebcf28d7d90ca0e7c3354b83cee4a5f28862b06d";

function sha256Hex_(value) {
  const bytes = Utilities.computeDigest(
    Utilities.DigestAlgorithm.SHA_256,
    String(value ?? ""),
    Utilities.Charset.UTF_8
  );

  return bytes
    .map((b) => ((b + 256) % 256).toString(16).padStart(2, "0"))
    .join("");
}

function teacherPasscodeMatches_(passcode) {
  const configuredHash =
    PropertiesService.getScriptProperties().getProperty(
      "LL_TEACHER_PASSCODE_SHA256"
    ) || TEACHER_DEFAULT_PASSCODE_SHA256;

  return sha256Hex_(norm_(passcode || "")) === configuredHash;
}

'''
          s = s[:start] + auth + s[end:]
          s = s.replace(
              "if (passcode && passcode === teacherPasscode_()) {",
              "if (passcode && teacherPasscodeMatches_(passcode)) {",
              1,
          )
          p.write_text(s, encoding="utf-8")
          PY
      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/teacher-admin.js
          node --check /tmp/teacher-admin.js
      - name: Validate React build
        run: |
          npm ci
          npm run build
      - name: Commit patched product files
        run: |
          if git diff --quiet -- src/pages/admin/AdminPage.tsx docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs; then
            echo "No product changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminPage.tsx docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs
          git commit -m "Harden teacher admin and password"
          git push origin HEAD:fluffy-cloud
