name: Polish Global Manager Control Center

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - scripts/polish_admin_control_center.py
      - .github/workflows/polish-admin-control-center.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply control center polish
        run: python scripts/polish_admin_control_center.py

      - name: Validate React production build
        run: |
          npm ci
          npm run build

      - name: Commit validated UI
        run: |
          if git diff --quiet -- src/pages/admin/AdminPage.tsx; then
            echo "No UI changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminPage.tsx
          git commit -m "Polish Global Manager control center"
          git push origin HEAD:fluffy-cloud
