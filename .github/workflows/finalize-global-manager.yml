name: Finalize Global Manager

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - scripts/finalize_global_manager.py
      - .github/workflows/finalize-global-manager.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final lifecycle hardening
        run: python scripts/finalize_global_manager.py

      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/teacher-admin.js
          node --check /tmp/teacher-admin.js

      - name: Validate React production build
        run: |
          npm ci
          npm run build

      - name: Commit validated product files
        run: |
          if git diff --quiet -- src/data.ts src/pages/admin/AdminPage.tsx src/pages/admin/components/ArchivedStudentsPanel.tsx docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs; then
            echo "No product changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.ts src/pages/admin/AdminPage.tsx src/pages/admin/components/ArchivedStudentsPanel.tsx docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs
          git commit -m "Harden final Global Manager lifecycle"
          git push origin HEAD:fluffy-cloud
