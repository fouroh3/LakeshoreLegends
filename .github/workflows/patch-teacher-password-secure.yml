name: Patch Teacher Password Securely

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - scripts/patch_teacher_password_secure.py
      - .github/workflows/patch-teacher-password-secure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch password
        run: python scripts/patch_teacher_password_secure.py
      - name: Validate Apps Script
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/teacher-admin.js
          node --check /tmp/teacher-admin.js
      - name: Commit replacement Apps Script
        run: |
          if git diff --quiet -- docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs; then
            echo "No Apps Script change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs
          git commit -m "Change teacher admin password"
          git push origin HEAD:fluffy-cloud
