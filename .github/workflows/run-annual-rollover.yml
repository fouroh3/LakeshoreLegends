name: Run Annual School-Year Rollover
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-annual-rollover.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply annual rollover feature
        run: python scripts/add_annual_rollover.py
      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.js
          node --check /tmp/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.js
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs src/pages/admin/adminApi.ts src/pages/admin/adminConstants.ts src/pages/admin/adminRosterUtils.ts src/pages/admin/AdminPage.tsx src/pages/admin/components/AnnualRolloverPanel.tsx
          git commit -m "Add safe annual school-year rollover"
          git push origin HEAD:fluffy-cloud
