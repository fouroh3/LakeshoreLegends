name: Build Global Manager Media Phase

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - scripts/patch_global_manager_media.py
      - scripts/fix_global_manager_patch.py
      - .github/workflows/build-global-manager-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden patch targeting
        run: python scripts/fix_global_manager_patch.py

      - name: Remove unused draft import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_global_manager_media.py')
          s = p.read_text(encoding='utf-8').replace('  LayoutDashboard,\\n', '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch Global Manager and Apps Script
        run: python scripts/patch_global_manager_media.py

      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/teacher-admin.js
          node --check /tmp/teacher-admin.js

      - name: Validate React production build
        run: |
          npm ci
          npm run build

      - name: Commit validated product files
        run: |
          if git diff --quiet -- src/pages/admin/AdminPage.tsx docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs; then
            echo "No product changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminPage.tsx docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs
          git commit -m "Add roster media and companion management"
          git push origin HEAD:fluffy-cloud
