name: Run Admin Sidebar Intro Removal
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-remove-admin-nav-intro.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Remove sidebar intro block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/AdminPage.tsx')
          s = p.read_text()
          s = s.replace('  PanelLeft,\n', '', 1)
          start_marker = '            <div className="mb-1 rounded-[22px] border border-cyan-300/10'
          end_marker = '            <NavGroupLabel tone="cyan">Overview</NavGroupLabel>'
          start = s.find(start_marker)
          end = s.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('sidebar intro markers not found')
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminPage.tsx
          git commit -m "Remove redundant admin sidebar intro"
          git push origin HEAD:fluffy-cloud
