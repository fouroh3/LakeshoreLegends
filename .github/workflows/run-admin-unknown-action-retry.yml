name: Run Admin Unknown Action Retry Hardening
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-admin-unknown-action-retry.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Patch retry handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/adminApi.ts')
          s = p.read_text()
          s = s.replace('  const maxAttempts = RETRYABLE_ADMIN_READS.has(action) ? 2 : 1;\n  let lastError: Error | null = null;\n\n  for (let attempt = 0; attempt < maxAttempts; attempt++) {', '  const retryableRead = RETRYABLE_ADMIN_READS.has(action);\n  const maxAttempts = 3;\n  let lastError: Error | null = null;\n\n  for (let attempt = 0; attempt < maxAttempts; attempt++) {', 1)
          old = '''    } catch (err: any) {\n      lastError = err instanceof Error ? err : new Error(String(err || "Admin API failed."));\n      if (attempt + 1 < maxAttempts) {\n        await new Promise((resolve) => window.setTimeout(resolve, 300));\n      }\n    }\n  }\n'''
          new = '''    } catch (err: any) {\n      lastError = err instanceof Error ? err : new Error(String(err || "Admin API failed."));\n      const unknownAction = /^Unknown action:/i.test(lastError.message.trim());\n      const canRetryUnknownAction = unknownAction && attempt < 2;\n      const canRetryRead = retryableRead && attempt < 1;\n\n      if (!canRetryUnknownAction && !canRetryRead) break;\n\n      await new Promise((resolve) =>\n        window.setTimeout(resolve, canRetryUnknownAction ? 650 : 300)\n      );\n    }\n  }\n'''
          if old not in s:
              raise SystemExit('catch block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/adminApi.ts
          git commit -m "Retry Apps Script unknown-action propagation errors"
          git push origin HEAD:fluffy-cloud
