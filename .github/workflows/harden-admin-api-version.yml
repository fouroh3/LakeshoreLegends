name: Harden Admin API Version

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/harden-admin-api-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Add backend version check and safe read retry
        shell: python
        run: |
          from pathlib import Path

          VERSION = "2026-09-01.1"

          def once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"Missing patch target: {label}")
              return text.replace(old, new, 1)

          # Apps Script advertises the backend build version.
          p = Path("docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs")
          s = p.read_text(encoding="utf-8")
          s = once(
              s,
              "const CFG = {",
              f'const ADMIN_API_VERSION = "{VERSION}";\n\nconst CFG = {{',
              "apps script version constant",
          )
          s = once(
              s,
              '''function adminSystemStatus_(args) {\n  const verified = verifyTeacher_(args || {});\n  return playerStateStatusPayload_(verified.token);\n}''',
              '''function adminSystemStatus_(args) {\n  const verified = verifyTeacher_(args || {});\n  const payload = playerStateStatusPayload_(verified.token);\n  payload.adminApiVersion = ADMIN_API_VERSION;\n  return payload;\n}''',
              "system status version",
          )
          p.write_text(s, encoding="utf-8")

          # Frontend expects the same version and retries read-only admin calls once.
          p = Path("src/pages/admin/adminApi.ts")
          s = p.read_text(encoding="utf-8")
          s = once(
              s,
              '''import type {\n  AdminAttributeValues,''',
              f'''export const ADMIN_API_VERSION = "{VERSION}";\n\nimport type {{\n  AdminAttributeValues,''',
              "frontend version constant",
          )
          s = once(
              s,
              '''  mediaBranch?: string;\n  [key: string]: any;''',
              '''  mediaBranch?: string;\n  adminApiVersion?: string;\n  [key: string]: any;''',
              "system status version type",
          )

          old_fn = '''async function postAdminAction<T>(\n  action: AdminAction,\n  body: Record<string, any>\n): Promise<T> {\n  const res = await fetch(\n    `${HP_API_URL}?action=${encodeURIComponent(action)}&_=${Date.now()}`,\n    {\n      method: "POST",\n      headers: {\n        "Content-Type": "text/plain;charset=utf-8",\n      },\n      body: JSON.stringify({\n        action,\n        teacherToken: getBattleTeacherToken(),\n        ...body,\n      }),\n    }\n  );\n\n  const text = await res.text();\n  let data: any = null;\n\n  try {\n    data = text ? JSON.parse(text) : null;\n  } catch {\n    throw new Error(\n      `Admin API returned non-JSON (${res.status}). ${text\n        .slice(0, 160)\n        .replace(/\\s+/g, " ")}`\n    );\n  }\n\n  if (!res.ok || !data?.ok) {\n    throw new Error(data?.error || `Admin API failed: ${res.status}`);\n  }\n\n  return data as T;\n}\n'''

          new_fn = '''const RETRYABLE_ADMIN_READS = new Set<AdminAction>([\n  "admincurrencysnapshot",\n  "admininventorysnapshot",\n  "adminsystemstatus",\n  "adminarchivedstudents",\n  "adminabilitysnapshot",\n  "adminstoresnapshot",\n]);\n\nasync function postAdminAction<T>(\n  action: AdminAction,\n  body: Record<string, any>\n): Promise<T> {\n  const maxAttempts = RETRYABLE_ADMIN_READS.has(action) ? 2 : 1;\n  let lastError: Error | null = null;\n\n  for (let attempt = 0; attempt < maxAttempts; attempt++) {\n    try {\n      const res = await fetch(\n        `${HP_API_URL}?action=${encodeURIComponent(action)}&_=${Date.now()}-${attempt}`,\n        {\n          method: "POST",\n          headers: {\n            "Content-Type": "text/plain;charset=utf-8",\n          },\n          body: JSON.stringify({\n            action,\n            teacherToken: getBattleTeacherToken(),\n            ...body,\n          }),\n        }\n      );\n\n      const text = await res.text();\n      let data: any = null;\n\n      try {\n        data = text ? JSON.parse(text) : null;\n      } catch {\n        throw new Error(\n          `Admin API returned non-JSON (${res.status}). ${text\n            .slice(0, 160)\n            .replace(/\\s+/g, " ")}`\n        );\n      }\n\n      if (!res.ok || !data?.ok) {\n        throw new Error(data?.error || `Admin API failed: ${res.status}`);\n      }\n\n      return data as T;\n    } catch (err: any) {\n      lastError = err instanceof Error ? err : new Error(String(err || "Admin API failed."));\n      if (attempt + 1 < maxAttempts) {\n        await new Promise((resolve) => window.setTimeout(resolve, 300));\n      }\n    }\n  }\n\n  throw lastError || new Error("Admin API failed.");\n}\n'''
          s = once(s, old_fn, new_fn, "admin API retry wrapper")
          p.write_text(s, encoding="utf-8")

          # Global Manager displays a clear backend mismatch banner.
          p = Path("src/pages/admin/AdminPage.tsx")
          s = p.read_text(encoding="utf-8")
          s = once(
              s,
              '''  adminAdjustCurrency,\n  adminAdjustInventory,''',
              '''  ADMIN_API_VERSION,\n  adminAdjustCurrency,\n  adminAdjustInventory,''',
              "AdminPage version import",
          )
          s = once(
              s,
              '''  const systemStatusProblem = systemStatusResolved && !playerStateReady;\n  const systemStatusUnavailable = !statusLoading && systemStatusError;''',
              '''  const systemStatusProblem = systemStatusResolved && !playerStateReady;\n  const backendVersionMismatch = Boolean(\n    systemStatusResolved && systemStatus?.adminApiVersion !== ADMIN_API_VERSION\n  );\n  const systemStatusUnavailable = !statusLoading && systemStatusError;''',
              "backend mismatch state",
          )
          marker = '''        {systemStatusProblem && (\n          <div className="mb-5 rounded-[26px] border border-amber-300/25 bg-amber-950/20 p-4 sm:p-5">'''
          replacement = '''        {backendVersionMismatch && (\n          <div className="mb-5 rounded-[26px] border border-red-300/25 bg-red-950/20 p-4 sm:p-5">\n            <div className="font-black text-red-100">Global Manager backend update required</div>\n            <p className="mt-1 max-w-4xl text-sm leading-6 text-red-100/70">\n              This browser is running Admin API {ADMIN_API_VERSION}, but the deployed Apps Script reports {systemStatus?.adminApiVersion || "an older build"}. Replace the Web App with the current full Apps Script file and deploy a new version before using management tools.\n            </p>\n          </div>\n        )}\n\n        {systemStatusProblem && (\n          <div className="mb-5 rounded-[26px] border border-amber-300/25 bg-amber-950/20 p-4 sm:p-5">'''
          s = once(s, marker, replacement, "backend mismatch banner")
          p.write_text(s, encoding="utf-8")

      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/admin.js
          node --check /tmp/admin.js

      - name: Validate React production build
        run: |
          npm ci
          npm run build

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs src/pages/admin/adminApi.ts src/pages/admin/AdminPage.tsx
          git commit -m "Detect stale Global Manager backend deployments"
          git push origin HEAD:fluffy-cloud
