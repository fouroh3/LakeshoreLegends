name: Run R2 Public Media URL Repair
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-fix-r2-public-media-url.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply patch
        run: python scripts/fix_r2_public_media_url.py
      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/admin-appscript.js
          node --check /tmp/admin-appscript.js
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs src/pages/admin/adminApi.ts src/pages/admin/AdminPage.tsx src/pages/admin/components/HeroImageManagerPanel.tsx
          git commit -m "Fix R2 public media URL handling"
          git push origin HEAD:fluffy-cloud
