name: Run Annual Rollover Hardening
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-harden-annual-rollover.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply hardening
        run: python scripts/harden_annual_rollover.py
      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.js
          node --check /tmp/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.js
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs
          git commit -m "Harden annual rollover archive safety"
          git push origin HEAD:fluffy-cloud
