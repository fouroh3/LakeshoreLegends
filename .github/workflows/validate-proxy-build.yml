name: Validate Proxy Build

on:
  push:
    branches:
      - fluffy-cloud
    paths:
      - vite.config.ts
      - src/pages/battle/battleConstants.ts
      - public/_redirects
      - .github/workflows/validate-proxy-build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
