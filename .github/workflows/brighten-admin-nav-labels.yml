name: Brighten Admin Nav Labels

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/brighten-admin-nav-labels.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Improve left navigation group labels
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/pages/admin/AdminPage.tsx")
          s = p.read_text(encoding="utf-8")
          old = 'text-[10px] font-bold uppercase tracking-[0.2em] text-zinc-600'
          new = 'text-[11px] font-black uppercase tracking-[0.18em] text-zinc-400'
          count = s.count(old)
          if count < 5:
              raise RuntimeError(f"Expected at least 5 admin group labels, found {count}")
          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
      - name: Validate production build
        run: |
          npm ci
          npm run build
      - name: Commit validated nav contrast fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminPage.tsx
          git commit -m "Improve Global Manager nav label contrast"
          git push origin HEAD:fluffy-cloud
