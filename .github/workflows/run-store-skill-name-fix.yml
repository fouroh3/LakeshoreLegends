name: Run Store Skill Name Fix
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-store-skill-name-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply Store skill name fix
        run: python scripts/fix_store_skill_card_names.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/store/components/SkillTrainingPanel.tsx
          git commit -m "Make Store skill names fully readable"
          git push origin HEAD:fluffy-cloud
