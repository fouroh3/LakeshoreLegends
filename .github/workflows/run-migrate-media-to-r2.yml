name: Run R2 Media Migration Patch

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-migrate-media-to-r2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python scripts/migrate_media_to_r2.py
      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/admin-appscript.js
          node --check /tmp/admin-appscript.js
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit R2 migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs src/pages/admin/adminApi.ts src/pages/admin/AdminPage.tsx src/pages/admin/components/HeroImageManagerPanel.tsx
          git commit -m "Move admin media storage to Cloudflare R2"
          git push origin HEAD:fluffy-cloud
