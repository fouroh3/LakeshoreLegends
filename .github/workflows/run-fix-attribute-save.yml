name: Run Attribute Save Fix

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-fix-attribute-save.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python scripts/fix_attribute_save.py
      - run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/lakeshore-admin.js
          node --check /tmp/lakeshore-admin.js
      - run: |
          npm ci
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/adminApi.ts src/pages/admin/AdminPage.tsx docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs
          git commit -m "Harden attribute saves and dismiss success notices"
          git push origin HEAD:fluffy-cloud
