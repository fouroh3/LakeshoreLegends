name: Run Global Manager Navigation v4
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-admin-nav-v4.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply nav polish
        run: python scripts/polish_admin_nav_v4.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminPage.tsx
          git commit -m "Refine Global Manager navigation rail"
          git push origin HEAD:fluffy-cloud
