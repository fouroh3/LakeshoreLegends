name: Fix Abilities Student Picker

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/fix-abilities-student-picker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Replace student dropdown with filterable roster
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/pages/admin/components/AbilitiesManagerPanel.tsx")
          s = p.read_text(encoding="utf-8")

          old = '''      <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-[220px_minmax(0,1fr)_minmax(280px,1.4fr)]">\n        <div>\n          <FieldLabel>Homeroom</FieldLabel>\n          <select\n            value={homeroomFilter}\n            onChange={(event) => {\n              setHomeroomFilter(event.target.value);\n              setSelectedId("");\n              setSnapshot(null);\n            }}\n            className="mt-2 w-full rounded-2xl border border-white/10 bg-black/40 px-3 py-3 text-sm text-white outline-none"\n          >\n            <option value="ALL">All Homerooms</option>\n            {homerooms.map((homeroom) => (\n              <option key={homeroom} value={homeroom}>\n                {homeroom}\n              </option>\n            ))}\n          </select>\n        </div>\n\n        <div>\n          <FieldLabel>Search</FieldLabel>\n          <input\n            value={query}\n            onChange={(event) => setQuery(event.target.value)}\n            placeholder="Name, student ID, or guild"\n            className="mt-2 w-full rounded-2xl border border-white/10 bg-black/40 px-3 py-3 text-sm text-white outline-none placeholder:text-zinc-600"\n          />\n        </div>\n\n        <div>\n          <FieldLabel>Student</FieldLabel>\n          <select\n            value={selectedId}\n            onChange={(event) => setSelectedId(event.target.value)}\n            className="mt-2 w-full rounded-2xl border border-white/10 bg-black/40 px-3 py-3 text-sm text-white outline-none"\n          >\n            <option value="">Choose student...</option>\n            {visibleStudents.map((student) => (\n              <option key={student.id} value={normId(student.id)}>\n                {fullName(student)} · {student.homeroom} · {student.guild || "Unassigned"}\n              </option>\n            ))}\n          </select>\n        </div>\n      </div>\n'''

          new = '''      <div className="grid gap-3 md:grid-cols-[220px_minmax(0,1fr)]">\n        <div>\n          <FieldLabel>Homeroom</FieldLabel>\n          <select\n            value={homeroomFilter}\n            onChange={(event) => {\n              setHomeroomFilter(event.target.value);\n              setSelectedId("");\n              setSnapshot(null);\n            }}\n            className="mt-2 w-full rounded-2xl border border-white/10 bg-black/40 px-3 py-3 text-sm text-white outline-none"\n          >\n            <option value="ALL">All Homerooms</option>\n            {homerooms.map((homeroom) => (\n              <option key={homeroom} value={homeroom}>\n                {homeroom}\n              </option>\n            ))}\n          </select>\n        </div>\n\n        <div>\n          <FieldLabel>Search</FieldLabel>\n          <input\n            value={query}\n            onChange={(event) => setQuery(event.target.value)}\n            placeholder="Name, student ID, or guild"\n            className="mt-2 w-full rounded-2xl border border-white/10 bg-black/40 px-3 py-3 text-sm text-white outline-none placeholder:text-zinc-600"\n          />\n        </div>\n      </div>\n\n      <div className="overflow-hidden rounded-[24px] border border-white/10 bg-black/25">\n        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-white/10 px-4 py-3">\n          <div>\n            <div className="text-sm font-black text-white">Students</div>\n            <div className="mt-0.5 text-xs text-zinc-500">\n              Click a student to edit attributes and skills.\n            </div>\n          </div>\n          <div className="rounded-full border border-white/10 bg-white/[0.04] px-3 py-1.5 text-xs font-semibold text-cyan-100/80">\n            {visibleStudents.length} shown\n          </div>\n        </div>\n\n        <div className="max-h-[320px] overflow-auto">\n          {visibleStudents.map((student) => {\n            const studentId = normId(student.id);\n            const selected = studentId === normId(selectedId);\n\n            return (\n              <button\n                key={studentId}\n                type="button"\n                onClick={() => setSelectedId(studentId)}\n                className={[\n                  "grid w-full grid-cols-[minmax(0,1fr)_100px_130px] items-center gap-3 border-t border-white/5 px-4 py-3 text-left transition first:border-t-0",\n                  selected\n                    ? "bg-cyan-300/[0.09] text-white"\n                    : "hover:bg-white/[0.035]",\n                ].join(" ")}\n              >\n                <div className="min-w-0">\n                  <div className="truncate text-sm font-bold text-white">\n                    {fullName(student) || "Unnamed Legend"}\n                  </div>\n                  <div className="mt-0.5 truncate font-mono text-[11px] text-cyan-100/60">\n                    {studentId}\n                  </div>\n                </div>\n                <div className="text-sm text-zinc-400">\n                  {clean(student.homeroom) || "—"}\n                </div>\n                <div className="truncate text-sm text-zinc-400">\n                  {clean(student.guild) || "Unassigned"}\n                </div>\n              </button>\n            );\n          })}\n\n          {visibleStudents.length === 0 && (\n            <div className="px-5 py-10 text-center text-sm text-zinc-500">\n              No students match the current filters.\n            </div>\n          )}\n        </div>\n      </div>\n'''

          if old not in s:
              raise RuntimeError("Could not find Abilities Manager student picker block")

          s = s.replace(old, new, 1)
          s = s.replace(
              '          Choose a student to edit attributes and skills.',
              '          Select a student from the roster above to edit attributes and skills.',
              1,
          )
          p.write_text(s, encoding="utf-8")

      - name: Validate React production build
        run: |
          npm ci
          npm run build

      - name: Commit validated UI
        run: |
          if git diff --quiet -- src/pages/admin/components/AbilitiesManagerPanel.tsx; then
            echo "No UI changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/components/AbilitiesManagerPanel.tsx
          git commit -m "Use roster picker in Abilities Manager"
          git push origin HEAD:fluffy-cloud
