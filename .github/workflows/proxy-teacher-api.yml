name: Proxy Teacher API

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/proxy-teacher-api.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Route teacher and admin API through same-origin proxy
        shell: python
        run: |
          from pathlib import Path

          DEPLOYMENT = "AKfycbw6gMIFYPvaljF3Ls-waojzprU6bygZZonOIJeKLopN2NSKgkDT-EsRKznxQiGpth_6"
          GOOGLE_URL = f"https://script.google.com/macros/s/{DEPLOYMENT}/exec"

          def once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"Missing patch target: {label}")
              return text.replace(old, new, 1)

          # Teacher/admin calls use a same-origin proxy. Student battle calls keep
          # using the direct Apps Script URL to avoid centralizing classroom traffic.
          p = Path("src/pages/battle/battleConstants.ts")
          s = p.read_text(encoding="utf-8")
          old = f'''export const HP_API_URL =\n  "{GOOGLE_URL}";'''
          new = f'''export const HP_API_URL =\n  "{GOOGLE_URL}";\n\nexport const TEACHER_API_URL = import.meta.env.DEV\n  ? "/api/teacher"\n  : "/.netlify/functions/apps-script-proxy";'''
          s = once(s, old, new, "teacher API constant")
          p.write_text(s, encoding="utf-8")

          p = Path("src/pages/battle/battleTeacherApi.ts")
          s = p.read_text(encoding="utf-8")
          s = once(
              s,
              'import { HP_API_URL } from "./battleConstants";',
              'import { TEACHER_API_URL } from "./battleConstants";',
              "teacher API import",
          )
          s = s.replace('${HP_API_URL}?action=', '${TEACHER_API_URL}?action=')
          if 'HP_API_URL' in s:
              raise RuntimeError("battleTeacherApi still references HP_API_URL")
          p.write_text(s, encoding="utf-8")

          p = Path("src/pages/admin/adminApi.ts")
          s = p.read_text(encoding="utf-8")
          s = once(
              s,
              'import { HP_API_URL } from "../battle/battleConstants";',
              'import { TEACHER_API_URL } from "../battle/battleConstants";',
              "admin API import",
          )
          s = s.replace('${HP_API_URL}?action=', '${TEACHER_API_URL}?action=')
          if 'HP_API_URL' in s:
              raise RuntimeError("adminApi still references HP_API_URL")
          p.write_text(s, encoding="utf-8")

          # Vite development proxy follows Apps Script redirects server-side, so
          # the browser never enters Google's multi-account routing layer.
          p = Path("vite.config.ts")
          s = p.read_text(encoding="utf-8")
          old = '''export default defineConfig({\n  plugins: [react()],\n});'''
          new = f'''export default defineConfig({{\n  plugins: [react()],\n  server: {{\n    proxy: {{\n      "/api/teacher": {{\n        target: "https://script.google.com",\n        changeOrigin: true,\n        followRedirects: true,\n        rewrite: (path) =>\n          path.replace(\n            /^\\/api\\/teacher/,\n            "/macros/s/{DEPLOYMENT}/exec"\n          ),\n      }},\n    }},\n  }},\n}});'''
          s = once(s, old, new, "vite proxy")
          p.write_text(s, encoding="utf-8")

          # Production proxy. Node's fetch follows the Apps Script redirect on
          # the server, completely bypassing browser Google-account state.
          p = Path("netlify/functions/apps-script-proxy.mjs")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(f'''const DEFAULT_APPS_SCRIPT_URL =\n  "{GOOGLE_URL}";\n\nexport const handler = async (event) => {{\n  const targetBase = process.env.LL_APPS_SCRIPT_URL || DEFAULT_APPS_SCRIPT_URL;\n  const params = new URLSearchParams(event.queryStringParameters || {{}});\n  const targetUrl = `${{targetBase}}${{params.size ? `?${{params.toString()}}` : ""}}`;\n  const method = String(event.httpMethod || "GET").toUpperCase();\n\n  try {{\n    const response = await fetch(targetUrl, {{\n      method,\n      headers: {{\n        "Content-Type": event.headers?.["content-type"] || "text/plain;charset=utf-8",\n      }},\n      body: method === "GET" || method === "HEAD" ? undefined : event.body || "",\n      redirect: "follow",\n    }});\n\n    const body = await response.text();\n\n    return {{\n      statusCode: response.status,\n      headers: {{\n        "Content-Type": response.headers.get("content-type") || "application/json; charset=utf-8",\n        "Cache-Control": "no-store, max-age=0",\n      }},\n      body,\n    }};\n  }} catch (error) {{\n    return {{\n      statusCode: 502,\n      headers: {{\n        "Content-Type": "application/json; charset=utf-8",\n        "Cache-Control": "no-store, max-age=0",\n      }},\n      body: JSON.stringify({{\n        ok: false,\n        error: `Teacher API proxy failed: ${{error instanceof Error ? error.message : String(error)}}`,\n      }}),\n    }};\n  }}\n}};\n''', encoding="utf-8")

      - name: Validate proxy syntax
        run: node --check netlify/functions/apps-script-proxy.mjs

      - name: Validate React production build
        run: |
          npm ci
          npm run build

      - name: Commit validated proxy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/battle/battleConstants.ts src/pages/battle/battleTeacherApi.ts src/pages/admin/adminApi.ts vite.config.ts netlify/functions/apps-script-proxy.mjs
          git commit -m "Proxy teacher admin API through Lakeshore Legends"
          git push origin HEAD:fluffy-cloud
