name: Run Abilities Optimization

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-optimize-abilities.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply optimization patch
        run: python scripts/optimize_abilities_manager.py

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit optimized manager
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/data.ts src/pages/admin/adminApi.ts src/pages/admin/components/AbilitiesManagerPanel.tsx src/pages/admin/AdminPage.tsx
          git commit -m "Make Abilities Manager instant between students"
          git push origin HEAD:fluffy-cloud
