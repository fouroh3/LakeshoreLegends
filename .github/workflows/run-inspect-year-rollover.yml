name: Inspect Annual Rollover Targets
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-inspect-year-rollover.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - name: Inspect rollover targets
        run: python scripts/inspect_year_rollover_targets.py
