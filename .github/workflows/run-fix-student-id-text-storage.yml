name: Run StudentID Text Storage Hardening

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-fix-student-id-text-storage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python scripts/fix_student_id_text_storage.py
      - name: Validate Apps Script syntax
        run: |
          cp docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs /tmp/teacher-admin.js
          node --check /tmp/teacher-admin.js
      - name: Validate production build
        run: |
          npm ci
          npm run build
      - name: Commit hardened ID storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LakeshoreLegendsAppsScript-TeacherAdmin-FULL.gs src/pages/admin/adminApi.ts
          git commit -m "Keep StudentIDs and homerooms as literal text"
          git push origin HEAD:fluffy-cloud
