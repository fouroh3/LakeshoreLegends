name: Run Roster Lifecycle Refresh Fix

on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-roster-lifecycle-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python scripts/fix_roster_lifecycle_refresh.py
      - run: |
          npm ci
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminPage.tsx src/pages/admin/components/StudentManagePanel.tsx
          git commit -m "Keep roster lifecycle changes visible immediately"
          git push origin HEAD:fluffy-cloud
