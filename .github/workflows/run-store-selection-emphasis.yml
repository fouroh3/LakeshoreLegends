name: Run Store Selection Emphasis
on:
  push:
    branches: [fluffy-cloud]
    paths:
      - .github/workflows/run-store-selection-emphasis.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluffy-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply Store selection emphasis
        run: python scripts/emphasize_store_selections.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/store/components/StoreModeTabs.tsx src/pages/store/components/SkillTrainingPanel.tsx src/pages/store/components/AttributeGrid.tsx
          git commit -m "Make Store selections unmistakable"
          git push origin HEAD:fluffy-cloud
